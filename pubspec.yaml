name: qoldas
description: "An Interactive Mobile App That Facilitates Learning Kazakh Sign Language."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  google_sign_in: ^6.0.0
  cloud_firestore: ^5.6.7
  video_player: ^2.9.5
  audioplayers: ^6.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.11
  url_launcher: ^6.1.10
  firebase_dynamic_links: ^6.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.3.9
  hive_generator: ^2.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/data/courses/courses_data.json
    - assets/data/courses/courses.json
    - assets/data/lessons/lesson_module_data.json
    - assets/data/lessons/lessons_data.json
    - assets/data/levels/levels_data.json
    - assets/data/topics/topics_data.json
    - assets/data/topics/topic_titles.json
    - assets/data/usernames.json
    - assets/data/i18n/strings_ru.json
    - assets/data/i18n/strings_en.json
    - assets/data/i18n/strings_kk.json
    - assets/sounds/success.mp3
    - assets/sounds/ok.mp3
    - assets/sounds/fail.mp3
    - assets/icon/google_logo.png
    - assets/icon/microsoft_logo.png

    - assets/gifs/success.gif
    - assets/gifs/ok.gif
    - assets/gifs/fail.gif
    - assets/gifs/warning.gif
   



flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/icon/app_icon.png
  android: true
  ios: true
  android_12:
    image: assets/icon/app_icon.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#121212"
